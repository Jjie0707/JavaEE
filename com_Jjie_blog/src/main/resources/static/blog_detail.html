<!DOCTYPE html>
<html lang="en">


<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博客详情页</title>

    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/detail.css">
    <link rel="stylesheet" href="blog-editormd/css/editormd.preview.css">

</head>

<body>
    <div class="nav">
        <img src="pic/logo2.jpg" alt="">
        <span class="blog-title">blog</span>
        <div class="space"></div>
        <a class="nav-span" href="blog_list.html">主页</a>
        <a class="nav-span" href="blog_edit.html">写博客</a>
        <a class="nav-span" href="#" onclick="logout()">注销</a>
    </div>

    <div class="container">
        <div class="left">
        </div>
        <div class="right">
            <div class="content">
                <div class="title"></div>
                <div class="date"></div>
                <div id="detail" class="detail editormd-preview-theme"></div>
                <div class="operating" style="display:none;">
                    <button id="edit-button">编辑</button>
                    <button id="delete-button" onclick="deleteBlog()">删除</button>
                </div>
            </div>

        </div>
    </div>

    <script src="js/jquery.min.js"></script>
    <script src="blog-editormd/lib/marked.min.js"></script>
    <script src="blog-editormd/lib/prettify.min.js"></script>
    <script src="blog-editormd/lib/raphael.min.js"></script>
    <script src="blog-editormd/lib/underscore.min.js"></script>
    <script src="blog-editormd/lib/sequence-diagram.min.js"></script>
    <script src="blog-editormd/lib/flowchart.min.js"></script>
    <script src="blog-editormd/lib/jquery.flowchart.min.js"></script>
    <script src="blog-editormd/editormd.min.js"></script>
    <script src="js/common.js"></script>
    <script>
        getBlogDetail();
        getAuthor();

        function getBlogDetail() {
            var blogId = getQueryString("id");
            if (!blogId) {
                alert("缺少博客 id");
                // return;
            }

            $.ajax({
                url: "/blog/getdetail",
                type: "get",
                data: {
                    id: blogId
                },
                success: function(result) {
                    if (result && result.code === -1) {
                        alert(result.errorMsg || "用户未登录");
                        window.location.href = "blog_login.html";
                        return;
                    }

                    if (result.code !== 200 || result.data == null) {
                        alert(result.errorMsg || "获取博客详情失败");
                        return;
                    }

                    var blog = result.data || {};
                    $(".title").text(blog.title || "");
                    $(".date").text(blog.updateTime || "");
                    // Editormd 将 Markdown 转成 HTML，并处理标题、代码、列表等语法。
                    editormd.markdownToHTML("detail", {
                        markdown: blog.content || "",
                        htmlDecode: "style,script,iframe",
                        taskList: true,
                        tex: true,
                        flowChart: true,
                        sequenceDiagram: true
                    });
                    // 登录接口已将当前用户 ID 保存到 localStorage。只有作者本人可操作。
                    var currentUserId = Number(localStorage.getItem("id"));
                    if (currentUserId && currentUserId === Number(blog.userId)) {
                        $(".operating").show();
                        $("#edit-button").on("click", function() {
                            window.location.href = "blog_update.html?id=" + encodeURIComponent(blog.id);
                        });
                    }
                }
            });
        }

        function getAuthor() {
            var blogId = getQueryString("id");
            // if (!blogId) {
            //     return;
            // }

            $.ajax({
                url: "/user/getauthor",
                type: "get",
                data: {
                    id: blogId
                },
                success: function(result) {
                    if (result && result.code === -1) {
                        alert(result.errorMsg || "用户未登录");
                        window.location.href = "blog_login.html";
                        return;
                    }

                    if (!result || result.code !== 200 || !result.data) {
                        alert((result && result.errorMsg) || "获取作者信息失败");
                        return;
                    }

                    var author = result.data;
                    var cardHtml = '<div class="card">'
                            + '<img src="pic/user-avatar.webp" alt="用户头像">'
                            + '<h3>' + escapeHtml(author.userName || "未设置用户名") + '</h3>'
                            + '<a id="author-github-link" href="#">GitHub 地址</a>'
                            + '</div>';

                    $(".left").html(cardHtml);

                    if (author.githubUrl) {
                        $("#author-github-link").attr({
                            href: author.githubUrl,
                            target: "_blank",
                            rel: "noopener noreferrer"
                        });
                    }
                },
                error: function() {
                    alert("获取作者信息失败");
                }
            });
        }

        function getQueryString(name) {
            var reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)");
            var r = window.location.search.substring(1).match(reg);
            if (r != null) {
                return decodeURIComponent(r[2]);
            }
            return null;
        }

        function formatContent(content) {
            if (!content) {
                return "";
            }
            var parts = content.split(/\n+/);
            var html = "";
            for (var i = 0; i < parts.length; i++) {
                var text = $.trim(parts[i]);
                if (text) {
                    html += "<p>" + escapeHtml(text) + "</p>";
                }
            }
            return html;
        }

        function escapeHtml(text) {
            return String(text)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function deleteBlog() {
            var blogId = getQueryString("id");
            if (!blogId) {
                alert("缺少博客 id");
                return;
            }
            if (!window.confirm("确定要删除这篇博客吗？删除后无法恢复。")) {
                return;
            }
            $("#delete-button").prop("disabled", true).text("删除中...");
            requestDelete(blogId, "POST");
        }

        function requestDelete(blogId, httpMethod) {
            $.ajax({
                url: "/blog/delete",
                type: httpMethod,
                data: {
                    id: blogId
                },
                success: function(result) {
                    if (result && result.code === -1) {
                        alert(result.errorMsg || "登录已失效，请重新登录");
                        window.location.href = "blog_login.html";
                        return;
                    }
                    if (result && result.code === 200 && result.data === true) {
                        alert("删除成功");
                        window.location.href = "blog_list.html";
                    } else {
                        alert((result && result.errorMsg) || "删除失败，请重试");
                        $("#delete-button").prop("disabled", false).text("删除");
                    }
                },
                error: function(xhr) {
                    // 后端若只接受 GET，POST 会返回 405，这里自动再用 GET 请求一次。
                    if (httpMethod === "POST" && xhr.status === 405) {
                        requestDelete(blogId, "GET");
                        return;
                    }
                    var message = xhr.responseJSON && xhr.responseJSON.errorMsg;
                    alert(message || "删除失败，请检查登录状态");
                    $("#delete-button").prop("disabled", false).text("删除");
                }
            });
        }
    </script>
</body>

</html>
