<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博客登陆页</title>

    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/login.css">

</head>

<body>
    <div class="nav">
        <img src="pic/logo2.jpg" alt="">
        <span class="blog-title">blog</span>
        <div class="space"></div>
        <a class="nav-span" href="blog_list.html">主页</a>
        <a class="nav-span" href="blog_edit.html">写博客</a>
    </div>

    <div class="container-login">
        <div class="login-dialog">
            <h3>登陆</h3>
            <div class="row">
                <span>用户名</span>
                <input type="text" name="username" id="username">
            </div>
            <div class="row">
                <span>密码</span>
                <input type="password" name="password" id="password">
            </div>
            <div class="row">
                <button id="submit" onclick="login()">提交</button>
            </div>

        </div>
    </div>
    <script src="js/jquery.min.js"></script>
    <script>
        function login() {
            var usernameInput = $("#username");
            var passwordInput = $("#password");
            var submitButton = $("#submit");

            if (submitButton.prop("disabled")) {
                return;
            }

            submitButton.prop("disabled", true);

            $.ajax({
                url: "/user/login",
                type: "post",
                contentType: "application/json;charset=UTF-8",
                data: JSON.stringify({
                    userName: $.trim(usernameInput.val()),
                    password: passwordInput.val()
                }),
                success: function(result) {
                    if (result && result.code === -1) {
                        alert("用户未登录");
                        window.location.href = "blog_login.html";
                        return;
                    }

                    if (result && result.code === 200 && result.data && result.data.token) {
                        localStorage.setItem("id", result.data.id);
                        localStorage.setItem("token", result.data.token);
                        location.assign("blog_list.html");
                        return;
                    }

                    loginFailed();
                },
                error: function() {
                    loginFailed();
                },
                complete: function() {
                    submitButton.prop("disabled", false);
                }
            });
        }

        function loginFailed() {
            alert("账号或者密码错误");
            $("#username").val("");
            $("#password").val("");
            $("#username").focus();
        }

        $("#username, #password").on("keydown", function(event) {
            if (event.key === "Enter") {
                login();
            }
        });
    </script>
</body>

</html>
